name: Build and push loadgen image

on:
  push:
    branches:
      - test
    paths:
      - 'loadgen/**'
      - '.github/workflows/build-loadgen.yaml'
  workflow_dispatch: {}

env:
  REGISTRY: 765730767431.dkr.ecr.us-east-2.amazonaws.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build loadgen jar
        run: ./gradlew :loadgen:shadowJar
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: "765730767431"

      - name: Build and push loadgen image
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          docker build -t "$REGISTRY/datastax/cdc:loadgen" -t "$REGISTRY/datastax/cdc:loadgen-$SHORT_SHA" loadgen
          docker push "$REGISTRY/datastax/cdc:loadgen"
          docker push "$REGISTRY/datastax/cdc:loadgen-$SHORT_SHA"
